name: Code Quality
enable-email-notifications: true

on:
  # allows this workflow to be called by other workflows
  workflow_call:
  # allows manual triggering of the workflow from the Forgejo UI
  workflow_dispatch:

jobs:
  code-quality:
    name: code quality - TYPO3 ${{ matrix.typo3 }} - php${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          extensions: gd
          github-token: ${{ secrets.PAT_PORTRINO_GITHUB_COM_TOKEN }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # composer.lock isn't committed, so this resolves the newest packages of the TYPO3 version under test
      - name: Install dependencies
        run: |
          composer require --no-update "typo3/cms-core:^${{ matrix.typo3 }}"
          composer update --no-scripts --with-all-dependencies
        env:
          # All public TYPO3 12.4 releases are blocked by security advisories (fixes ship via ELTS only)
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.typo3 == '12.4' && '1' || '0' }}
          COMPOSER_AUTH: |
            {
              "github-oauth": {
                "github.com": "${{ secrets.PAT_PORTRINO_GITHUB_COM_TOKEN }}"
              }
            }

      # Fix code style temporarily, so that static code analysis won't abort because of code styling
      - name: Fix code style (temporary)
        run: composer fix:php:cs

      - name: Run static code analysis
        run: composer ci:static

      - name: Run unit tests
        run: composer ci:test
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        typo3: [ '12.4', '13.4', '14.3' ]
        exclude:
          # TYPO3 12.4 supports PHP up to 8.4
          - typo3: '12.4'
            php: '8.5'
