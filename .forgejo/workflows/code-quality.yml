name: Code Quality
enable-email-notifications: true

on:
  # allows this workflow to be called by other workflows
  workflow_call:
  # allows manual triggering of the workflow from the Forgejo UI
  workflow_dispatch:

jobs:
  code-quality:
    name: code quality - php${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@verbose
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          extensions: gd
          github-token: ${{ secrets.PAT_PORTRINO_GITHUB_COM_TOKEN }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-scripts
        env:
          COMPOSER_AUTH: |
            {
              "github-oauth": {
                "github.com": "${{ secrets.PAT_PORTRINO_GITHUB_COM_TOKEN }}"
              }
            }

      # Fix code style temporarily, so that static code analysis won't abort because of code styling
      - name: Fix code style (temporary)
        run: composer fix:php:cs

      - name: Run static code analysis
        run: composer ci:static

      - name: Run unit tests
        run: composer ci:test
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
