name: CI

on:
  pull_request:
  push:
    # only trigger action if commits to master branch are pushed,
    # to prevent the action from being executed twice on pull requests
    branches:
      - master

jobs:
  code-quality:
    name: code quality - TYPO3 ${{ matrix.typo3 }} - php${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --no-update "typo3/cms-core:^${{ matrix.typo3 }}"
          composer update --no-scripts --with-all-dependencies
        env:
          # All public TYPO3 12.4 releases are blocked by security advisories (fixes ship via ELTS only)
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.typo3 == '12.4' && '1' || '0' }}

      - name: Run static code analysis
        run: composer ci:static

      - name: Run unit tests
        run: composer test:unit
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        typo3: [ '12.4', '13.4', '14.3' ]
        exclude:
          # TYPO3 12.4 supports PHP up to 8.4
          - typo3: '12.4'
            php: '8.5'
