name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout fetches annotated tags as lightweight ones; refetch so the TER changelog gets the tag message
      - name: "Fetch the annotated tag"
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: "Publish new version to TER"
        uses: tomasnorre/typo3-upload-ter@45877fb28167bf38efda42ddd484824d7f273cca # v2.3.0
        with:
          api-token: ${{ secrets.TYPO3_API_TOKEN }}
